<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v=2 busts browsers' aggressive favicon cache (the Vite logo
         was replaced by the Campus Bites mark) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F97316" />
    <meta
      name="description"
      content="Campus Bites — order from the IET Lucknow canteen in seconds. Pre-order a slot, skip the queue, rate dishes, and pay at your seat."
    />
    <link
      rel="canonical"
      href="https://campus-bites-alpha.vercel.app/"
    />
    <title>Campus Bites — IET Lucknow Canteen Ordering</title>

    <!-- Open Graph (shares on WhatsApp, Instagram, etc.) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Campus Bites — IET Lucknow Canteen Ordering"
    />
    <meta
      property="og:description"
      content="Order from the IET Lucknow canteen in seconds — pre-order a slot, skip the queue, rate dishes."
    />
    <meta property="og:url" content="https://campus-bites-alpha.vercel.app/" />

    <!-- Structured data so search engines understand the canteen -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Campus Bites",
        "description": "Online canteen ordering for the Institute of Engineering and Technology (IET), Lucknow.",
        "servesCuisine": "Canteen",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Lucknow",
          "addressRegion": "UP",
          "addressCountry": "IN"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
